<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/img/logos/favicon.png" />
    <link rel="apple-touch-icon" href="/img/logos/favicon.png" />
    <title>Gestión de Productos - LITUM 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .title {
            color: #fff;
            font-size: 32px;
            background: linear-gradient(135deg, #64c8ff 0%, #9664ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.3);
        }

        .btn-primary:hover {
            background: rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(150, 100, 255, 0.2);
            color: #9664ff;
            border: 1px solid rgba(150, 100, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(150, 100, 255, 0.3);
            box-shadow: 0 0 20px rgba(150, 100, 255, 0.4);
        }

        .products-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.3);
            border-color: rgba(100, 200, 255, 0.5);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.2), rgba(150, 100, 255, 0.2));
            display: block;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #64c8ff;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #9664ff;
            margin-bottom: 8px;
        }

        .product-stock {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 12px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            flex: 1;
            padding: 8px;
            background: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-edit:hover {
            background: rgba(100, 200, 255, 0.3);
        }

        .btn-delete {
            flex: 1;
            padding: 8px;
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: rgba(255, 68, 68, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.95), rgba(48, 43, 99, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.3);
        }

        .modal-header {
            background: rgba(100, 200, 255, 0.1);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 20px;
            font-weight: 600;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            opacity: 0.9;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 10px rgba(100, 200, 255, 0.3);
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-save {
            padding: 10px 20px;
            background: rgba(100, 200, 255, 0.3);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.5);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 18px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1 class="title">📦 Gestión de Productos</h1>
        <div class="header-buttons">
            <button class="btn btn-primary" onclick="openNewProductModal()">➕ Nuevo Producto</button>
            <a href="/admin/dashboard" class="btn btn-secondary">← Volver al Dashboard</a>
        </div>
    </div>

    <div class="products-container">
        <div class="products-grid" id="productsGrid">
            <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <div class="empty-state-text">Cargando productos...</div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar/editar producto -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">➕ Nuevo Producto</div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label for="productName">Nombre del Producto (Español) *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productNameDe">Nombre (Alemán)</label>
                        <input type="text" id="productNameDe" placeholder="Deutsche Name">
                    </div>
                    <div class="form-group">
                        <label for="productNameFr">Nombre (Francés)</label>
                        <input type="text" id="productNameFr" placeholder="Nom français">
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Descripción (Español)</label>
                        <textarea id="productDescription"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productDescriptionDe">Descripción (Alemán)</label>
                        <textarea id="productDescriptionDe" placeholder="Deutsche Beschreibung"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productDescriptionFr">Descripción (Francés)</label>
                        <textarea id="productDescriptionFr" placeholder="Description française"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Precio (€) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productStock">Stock *</label>
                        <input type="number" id="productStock" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productImage">URL de la Imagen</label>
                        <input type="url" id="productImage" placeholder="https://...">
                    </div>
                    <!-- Base/Forma son OPCIONALES: existen productos activos y
                         vendibles sin ninguna variante configurada (ver
                         customization.js#hasSelectableModels, que ya permite
                         comprar sin modelo cuando el producto no tiene
                         variant-types). El HTML ya no debe fingir que son
                         universalmente obligatorias -- ver informe. -->
                    <div class="form-group">
                        <label for="variantBase">Base (opcional)</label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <select id="variantBase" style="flex:1;">
                                <option value="">Selecciona una base</option>
                                <!-- Opciones dinámicas -->
                            </select>
                            <button type="button" class="btn btn-secondary" style="padding:6px 10px;font-size:12px;"
                                onclick="openVariantModal('base')">+ Añadir</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="variantShape">Forma (opcional)</label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <select id="variantShape" style="flex:1;">
                                <option value="">Selecciona una forma</option>
                                <!-- Opciones dinámicas -->
                            </select>
                            <button type="button" class="btn btn-secondary" style="padding:6px 10px;font-size:12px;"
                                onclick="openVariantModal('forma')">+ Añadir</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeProductModal()">Cancelar</button>
                <button class="btn-save" onclick="saveProduct()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal para añadir variante -->
    <div class="modal" id="variantModal">
        <div class="modal-content" style="max-width:350px;">
            <div class="modal-header" id="variantModalTitle">Añadir nueva Variante</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="variantNameInput">Nombre *</label>
                    <input type="text" id="variantNameInput" required>
                </div>
                <div class="form-group">
                    <label for="variantPriceDeltaInput">Diferencia de precio (€)</label>
                    <input type="number" id="variantPriceDeltaInput" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="variantStockInput">Stock *</label>
                    <input type="number" id="variantStockInput" min="1" value="100" required>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" type="button" onclick="closeVariantModal()">Cancelar</button>
                <button class="btn-save" type="button" onclick="saveVariant()">Guardar</button>
            </div>
        </div>
    </div>

    <script src="/js/admin-fetch.js?v=20260818-1"></script>
    <script>
        // Abrir modal de nuevo producto
        function openNewProductModal() {
            document.getElementById('modalTitle').textContent = '➕ Nuevo Producto';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModal').classList.add('show');
        }

        // Cerrar modal de producto
        function closeProductModal() {
            document.getElementById('productModal').classList.remove('show');
        }

        // Cargar listado de productos y pintar cards
        async function loadProducts() {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⏳</div><div class="empty-state-text">Cargando productos...</div></div>`;
            try {
                const res = await fetch('/api/productos');
                if (!res.ok) throw new Error('No se pudieron obtener productos');
                const products = await res.json();

                if (!products.length) {
                    grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><div class="empty-state-text">No hay productos</div></div>`;
                    return;
                }

                grid.innerHTML = '';
                products.forEach((p) => {
                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img class="product-image" src="${p.imagen || '/img/productos/carrusel1.jpeg'}" alt="${p.nombre}">
                        <div class="product-name">${p.nombre}</div>
                        <div class="product-price">€ ${Number(p.precio).toFixed(2)}</div>
                        <div class="product-stock">Stock: ${p.stock}</div>
                        <div class="product-actions">
                            <button class="btn-edit" onclick="editProduct(${p.id})">Editar</button>
                            <button class="btn-delete" onclick="deleteProduct(${p.id})">Eliminar</button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error('Error cargando productos:', err);
                grid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">⚠️</div><div class="empty-state-text">Error al cargar productos</div></div>`;
            }
        }
        // Modal para añadir variante
        let currentVariantType = null;
        function openVariantModal(type) {
            currentVariantType = type;
            document.getElementById('variantModalTitle').textContent = type === 'base' ? 'Añadir nueva Base' : 'Añadir nueva Forma';
            document.getElementById('variantNameInput').value = '';
            document.getElementById('variantPriceDeltaInput').value = '';
            document.getElementById('variantStockInput').value = '100';
            document.getElementById('variantModal').classList.add('show');
        }

        function closeVariantModal() {
            document.getElementById('variantModal').classList.remove('show');
        }

        // Carga las opciones de Base y Forma para un producto (o el primero disponible)
        async function loadProductVariants(productId) {
            try {
                let targetProductId = productId;

                // Si no tenemos productId (nuevo producto), usa el primer producto existente
                if (!targetProductId) {
                    const resProducts = await fetch('/api/productos');
                    if (!resProducts.ok) throw new Error('No se pudieron obtener productos');
                    const products = await resProducts.json();
                    if (!products.length) {
                        console.warn('No hay productos para cargar variantes');
                        return;
                    }
                    targetProductId = products[0].id;
                }

                console.log('🔄 Cargando variantes para producto:', targetProductId);
                const res = await fetch(`/api/productos/${targetProductId}/variant-types`);
                if (!res.ok) throw new Error('No se pudieron obtener variantes');
                const types = await res.json();
                console.log('📦 Tipos de variantes recibidos:', types);

                const baseSelect = document.getElementById('variantBase');
                const shapeSelect = document.getElementById('variantShape');

                // Reinicia selects
                baseSelect.innerHTML = '<option value="">Selecciona una base</option>';
                shapeSelect.innerHTML = '<option value="">Selecciona una forma</option>';

                let baseCount = 0;
                let shapeCount = 0;

                types.forEach((type) => {
                    const isBase = type.nombre.toLowerCase() === 'base';
                    const isShape = type.nombre.toLowerCase() === 'forma';
                    if (!isBase && !isShape) return;

                    console.log(`📝 Procesando tipo: ${type.nombre}, opciones:`, type.options.length);

                    type.options.forEach((opt) => {
                        // price_delta/stock viajan como dataset del <option>:
                        // son la plantilla que se copiará al crear la opción
                        // REAL del producto nuevo (ver saveProduct) -- nunca
                        // se reutiliza opt.id, que pertenece a la variante de
                        // OTRO producto y no puede reasignarse sin corromper
                        // su catálogo.
                        if (isBase) {
                            const baseOption = document.createElement('option');
                            baseOption.value = opt.id;
                            baseOption.textContent = opt.nombre;
                            baseOption.dataset.priceDelta = opt.price_delta || 0;
                            baseOption.dataset.stock = opt.stock || 100;
                            baseSelect.appendChild(baseOption);
                            baseCount++;
                        }

                        if (isShape) {
                            const shapeOption = document.createElement('option');
                            shapeOption.value = opt.id;
                            shapeOption.textContent = opt.nombre;
                            shapeOption.dataset.priceDelta = opt.price_delta || 0;
                            shapeOption.dataset.stock = opt.stock || 100;
                            shapeSelect.appendChild(shapeOption);
                            shapeCount++;
                        }
                    });
                });

                console.log(`✅ Variantes cargadas - Bases: ${baseCount}, Formas: ${shapeCount}`);
            } catch (err) {
                console.error('❌ Error cargando variantes:', err);
            }
        }

        // Lee la opción actualmente seleccionada de un <select> Base/Forma
        // como una PLANTILLA {nombre, price_delta, stock} para crear una
        // variante nueva -- nunca como un ID a reasignar. El option.value es
        // el id de un product_variant_options que pertenece a OTRO producto
        // (loadProductVariants puede haberlo cargado desde el primero
        // existente cuando aún no hay producto propio); reutilizar ese id
        // directamente movería la variante de un producto ajeno. Solo su
        // nombre/price_delta/stock sirven de plantilla para POST /admin/variantes,
        // el mismo endpoint que ya usa "+ Añadir" en edición.
        function readVariantChoice(selectEl) {
            if (!selectEl || !selectEl.value) return null;
            const opt = selectEl.selectedOptions && selectEl.selectedOptions[0];
            if (!opt) return null;
            return {
                nombre: (opt.textContent || '').trim(),
                price_delta: parseFloat(opt.dataset.priceDelta || '0') || 0,
                stock: parseInt(opt.dataset.stock, 10) || 100
            };
        }

        // Asocia una plantilla Base/Forma a un producto ya creado, usando el
        // MISMO endpoint canónico que "+ Añadir" en edición
        // (product_variant_types/product_variant_options). product_id debe
        // ser el id REAL devuelto por la creación del producto -- nunca un
        // valor por defecto, para no caer en el fallback de
        // POST /admin/variantes que, si product_id llega vacío, adjunta la
        // variante al primer producto de la tabla.
        async function associateVariant(tipo, choice, productId) {
            if (!choice || !productId) return { ok: true, skipped: true };
            try {
                const res = await adminFetch('/admin/variantes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo,
                        nombre: choice.nombre,
                        price_delta: choice.price_delta,
                        stock: choice.stock,
                        product_id: productId
                    })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok || !data.success) {
                    return { ok: false, error: data.error || data.details || 'Error desconocido' };
                }
                return { ok: true };
            } catch (err) {
                return { ok: false, error: err.message };
            }
        }

        async function saveProduct() {
            try {
                const id = document.getElementById('productId').value;
                const nombre = document.getElementById('productName').value.trim();
                const descripcion = document.getElementById('productDescription').value.trim();
                const nombre_de = document.getElementById('productNameDe').value.trim();
                const nombre_fr = document.getElementById('productNameFr').value.trim();
                const descripcion_de = document.getElementById('productDescriptionDe').value.trim();
                const descripcion_fr = document.getElementById('productDescriptionFr').value.trim();
                const precio = parseFloat(document.getElementById('productPrice').value);
                const stock = parseInt(document.getElementById('productStock').value, 10) || 0;
                const imagen = document.getElementById('productImage').value.trim() || null;
                // Capturadas ANTES de la llamada de red: son plantillas
                // (nombre/price_delta/stock), no algo que /api/productos
                // necesite conocer.
                const baseChoice = readVariantChoice(document.getElementById('variantBase'));
                const shapeChoice = readVariantChoice(document.getElementById('variantShape'));

                if (!nombre || isNaN(precio)) {
                    alert('Nombre y precio son obligatorios');
                    return;
                }

                const body = {
                    nombre,
                    descripcion: descripcion || null,
                    nombre_de: nombre_de || null,
                    nombre_fr: nombre_fr || null,
                    descripcion_de: descripcion_de || null,
                    descripcion_fr: descripcion_fr || null,
                    precio,
                    stock,
                    imagen
                };

                const url = id ? `/api/productos/${id}` : '/api/productos';
                const method = id ? 'PUT' : 'POST';

                const res = await adminFetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || 'No se pudo guardar el producto');
                }

                // Asociar Base/Forma SOLO al crear un producto nuevo: en
                // edición, el select ya muestra las variantes propias del
                // producto (cargadas por loadProductVariants(p.id)) y
                // cualquier cambio se hace con "+ Añadir", que ya funciona.
                if (!id) {
                    const created = await res.json();
                    const newProductId = created.id;

                    const results = await Promise.all([
                        baseChoice ? associateVariant('base', baseChoice, newProductId) : Promise.resolve({ ok: true, skipped: true }),
                        shapeChoice ? associateVariant('forma', shapeChoice, newProductId) : Promise.resolve({ ok: true, skipped: true })
                    ]);
                    const failures = results
                        .map((r, i) => ({ tipo: i === 0 ? 'Base' : 'Forma', ...r }))
                        .filter((r) => !r.ok);

                    if (failures.length) {
                        // El producto SÍ se creó: no lo ocultamos ni fingimos
                        // un guardado completo. Se deja el modal abierto y en
                        // modo edición sobre el producto real ya creado, para
                        // que el Admin pueda reintentar con "+ Añadir" sin
                        // perder el productId.
                        document.getElementById('productId').value = newProductId;
                        document.getElementById('modalTitle').textContent = '✏️ Editar Producto';
                        await loadProducts();
                        await loadProductVariants(newProductId);
                        alert(
                            `⚠️ Producto creado (ID ${newProductId}), pero no se pudieron guardar todas las variantes:\n` +
                            failures.map((f) => `${f.tipo}: ${f.error}`).join('\n') +
                            `\n\nUsa "+ Añadir" para completarlas antes de cerrar este formulario.`
                        );
                        return;
                    }
                }

                await loadProducts();
                closeProductModal();
            } catch (err) {
                console.error('Error al guardar producto:', err);
                alert('Error al guardar producto: ' + err.message);
            }
        }

        async function editProduct(id) {
            try {
                const res = await fetch(`/api/productos/${id}`);
                if (!res.ok) throw new Error('No se pudo cargar el producto');
                const p = await res.json();

                document.getElementById('productId').value = p.id;
                document.getElementById('productName').value = p.nombre || '';
                document.getElementById('productDescription').value = p.descripcion || '';
                document.getElementById('productNameDe').value = p.nombre_de || '';
                document.getElementById('productNameFr').value = p.nombre_fr || '';
                document.getElementById('productDescriptionDe').value = p.descripcion_de || '';
                document.getElementById('productDescriptionFr').value = p.descripcion_fr || '';
                document.getElementById('productPrice').value = p.precio || '';
                document.getElementById('productStock').value = p.stock || 0;
                document.getElementById('productImage').value = p.imagen || '';

                document.getElementById('modalTitle').textContent = '✏️ Editar Producto';
                document.getElementById('productModal').classList.add('show');

                // Cargar variantes asociadas al producto
                loadProductVariants(p.id);
            } catch (err) {
                console.error('Error al editar producto:', err);
                alert('No se pudo cargar el producto: ' + err.message);
            }
        }

        async function deleteProduct(id) {
            const ok = confirm('¿Seguro que deseas eliminar este producto?');
            if (!ok) return;
            try {
                const res = await adminFetch(`/api/productos/${id}`, { method: 'DELETE' });
                if (!res.ok) {
                    const data = await res.json().catch(() => ({}));
                    throw new Error(data.error || 'No se pudo eliminar');
                }
                await loadProducts();
            } catch (err) {
                console.error('Error al eliminar producto:', err);
                alert('Error al eliminar: ' + err.message);
            }
        }

        async function saveVariant() {
            const nombre = document.getElementById('variantNameInput').value.trim();
            const price_delta = document.getElementById('variantPriceDeltaInput').value.trim();
            const stock = parseInt(document.getElementById('variantStockInput').value) || 100;
            const product_id = document.getElementById('productId').value;

            if (!nombre) {
                alert('Introduce un nombre para la variante');
                return;
            }

            if (!product_id) {
                alert('Por favor, primero selecciona o crea un producto antes de añadir variantes');
                return;
            }

            if (stock <= 0) {
                alert('El stock debe ser mayor a 0');
                return;
            }

            // Enviar al backend (endpoint a definir, ejemplo: /admin/variantes)
            try {
                console.log('📤 Enviando variante:', { tipo: currentVariantType, nombre, price_delta, stock, product_id });
                const res = await adminFetch('/admin/variantes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: currentVariantType,
                        nombre,
                        price_delta: price_delta ? parseFloat(price_delta) : 0,
                        stock: stock,
                        product_id: parseInt(product_id)
                    })
                });
                console.log('📨 Respuesta:', res.status, res.statusText);
                const data = await res.json();
                console.log('📨 Datos respuesta:', data);
                if (!res.ok) {
                    console.error('❌ Error al guardar variante:', data);
                    throw new Error(data.details || data.error || 'Error al guardar variante');
                }
                console.log('✅ Variante guardada exitosamente');
                // Recargar selectores con el ID del producto actual
                await loadProductVariants(product_id);
                closeVariantModal();
            } catch (e) {
                console.error('❌ Error completo:', e);
                alert('Error al guardar variante: ' + e.message);
            }
        }

        // Inicializar al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
            loadProductVariants(null);
        });
    </script>
    <!-- Código JS principal está dentro del <script> anterior -->

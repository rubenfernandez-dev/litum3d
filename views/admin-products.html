<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - LITUM 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .title {
            color: #fff;
            font-size: 32px;
            background: linear-gradient(135deg, #64c8ff 0%, #9664ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.3);
        }

        .btn-primary:hover {
            background: rgba(100, 200, 255, 0.3);
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(150, 100, 255, 0.2);
            color: #9664ff;
            border: 1px solid rgba(150, 100, 255, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(150, 100, 255, 0.3);
            box-shadow: 0 0 20px rgba(150, 100, 255, 0.4);
        }

        .products-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 20px rgba(100, 200, 255, 0.3);
            border-color: rgba(100, 200, 255, 0.5);
        }

        .product-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, rgba(100, 200, 255, 0.2), rgba(150, 100, 255, 0.2));
            display: block;
        }

        .product-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #64c8ff;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #9664ff;
            margin-bottom: 8px;
        }

        .product-stock {
            font-size: 12px;
            opacity: 0.8;
            margin-bottom: 12px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .btn-edit {
            flex: 1;
            padding: 8px;
            background: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-edit:hover {
            background: rgba(100, 200, 255, 0.3);
        }

        .btn-delete {
            flex: 1;
            padding: 8px;
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .btn-delete:hover {
            background: rgba(255, 68, 68, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, rgba(15, 12, 41, 0.95), rgba(48, 43, 99, 0.95));
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 0;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 0 40px rgba(100, 200, 255, 0.3);
        }

        .modal-header {
            background: rgba(100, 200, 255, 0.1);
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 20px;
            font-weight: 600;
        }

        .modal-body {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            opacity: 0.9;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 13px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 10px rgba(100, 200, 255, 0.3);
        }

        .modal-footer {
            padding: 15px 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .btn-save {
            padding: 10px 20px;
            background: rgba(100, 200, 255, 0.3);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.5);
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            opacity: 0.6;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .empty-state-text {
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 class="title">📦 Gestión de Productos</h1>
        <div class="header-buttons">
            <button class="btn btn-primary" onclick="openNewProductModal()">➕ Nuevo Producto</button>
            <a href="/admin/dashboard" class="btn btn-secondary">← Volver al Dashboard</a>
        </div>
    </div>

    <div class="products-container">
        <div class="products-grid" id="productsGrid">
            <div class="empty-state">
                <div class="empty-state-icon">📦</div>
                <div class="empty-state-text">Cargando productos...</div>
            </div>
        </div>
    </div>

    <!-- Modal para agregar/editar producto -->
    <div class="modal" id="productModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">➕ Nuevo Producto</div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="form-group">
                        <label for="productName">Nombre del Producto *</label>
                        <input type="text" id="productName" required>
                    </div>
                    <div class="form-group">
                        <label for="productDescription">Descripción</label>
                        <textarea id="productDescription"></textarea>
                    </div>
                    <div class="form-group">
                        <label for="productPrice">Precio (€) *</label>
                        <input type="number" id="productPrice" step="0.01" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productStock">Stock *</label>
                        <input type="number" id="productStock" min="0" required>
                    </div>
                    <div class="form-group">
                        <label for="productImage">URL de la Imagen</label>
                        <input type="url" id="productImage" placeholder="https://...">
                    </div>
                    <!-- Bloques de variantes obligatorios -->
                    <div class="form-group">
                        <label for="variantBase">Base *</label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <select id="variantBase" required style="flex:1;">
                                <option value="">Selecciona una base</option>
                                <!-- Opciones dinámicas -->
                            </select>
                            <button type="button" class="btn btn-secondary" style="padding:6px 10px;font-size:12px;" onclick="openVariantModal('base')">+ Añadir</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="variantShape">Forma *</label>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <select id="variantShape" required style="flex:1;">
                                <option value="">Selecciona una forma</option>
                                <!-- Opciones dinámicas -->
                            </select>
                            <button type="button" class="btn btn-secondary" style="padding:6px 10px;font-size:12px;" onclick="openVariantModal('forma')">+ Añadir</button>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeProductModal()">Cancelar</button>
                <button class="btn-save" onclick="saveProduct()">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Modal para añadir variante -->
    <div class="modal" id="variantModal">
        <div class="modal-content" style="max-width:350px;">
            <div class="modal-header" id="variantModalTitle">Añadir nueva Variante</div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="variantNameInput">Nombre *</label>
                    <input type="text" id="variantNameInput" required>
                </div>
                <div class="form-group">
                    <label for="variantPriceDeltaInput">Diferencia de precio (€)</label>
                    <input type="number" id="variantPriceDeltaInput" step="0.01" min="0">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" type="button" onclick="closeVariantModal()">Cancelar</button>
                <button class="btn-save" type="button" onclick="saveVariant()">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        // Abrir modal de nuevo producto
        function openNewProductModal() {
            document.getElementById('modalTitle').textContent = '➕ Nuevo Producto';
            document.getElementById('productForm').reset();
            document.getElementById('productId').value = '';
            document.getElementById('productModal').classList.add('show');
        }

        // Cerrar modal de producto
        function closeProductModal() {
            document.getElementById('productModal').classList.remove('show');
        }
        // Modal para añadir variante
        let currentVariantType = null;
        function openVariantModal(type) {
            currentVariantType = type;
            document.getElementById('variantModalTitle').textContent = type === 'base' ? 'Añadir nueva Base' : 'Añadir nueva Forma';
            document.getElementById('variantNameInput').value = '';
            document.getElementById('variantPriceDeltaInput').value = '';
            document.getElementById('variantModal').classList.add('show');
        }

        function closeVariantModal() {
            document.getElementById('variantModal').classList.remove('show');
        }

        async function saveVariant() {
            const nombre = document.getElementById('variantNameInput').value.trim();
            const price_delta = document.getElementById('variantPriceDeltaInput').value.trim();
            if (!nombre) {
                alert('Introduce un nombre para la variante');
                return;
            }
            // Enviar al backend (endpoint a definir, ejemplo: /admin/variantes)
            try {
                const res = await fetch('/admin/variantes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        tipo: currentVariantType,
                        nombre,
                        price_delta: price_delta ? parseFloat(price_delta) : 0
                    })
                });
                if (!res.ok) throw new Error('Error al guardar variante');
                // Recargar selectores
                loadProductVariants(document.getElementById('productId').value || null);
                closeVariantModal();
            } catch (e) {
                alert('Error al guardar variante');
            }
        }
    </script>
    <!-- Código JS principal está dentro del <script> anterior -->
    </script>
</body>
</html>

<!doctype html>
<html lang="de">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/img/logos/favicon.png" />
  <link rel="apple-touch-icon" href="/img/logos/favicon.png" />

  <title>Kundenbewertungen - LITUM3D</title>
  <link rel="stylesheet" href="/css/styles.css?v=20260818-1" />
  <script src="/js/navbar.js?v=20260818-1"></script>
</head>

<body>
  <header>
    <div class="header-top">
      <a href="/index-de" class="logo"><img src="/img/logos/lineal.logo.png" alt="LITUM3D Logo"></a>
      <div class="header-actions">
        <div class="language-selector">
          <span class="lang-flag">&#x1F1E9;&#x1F1EA;</span>
          <div class="lang-dropdown">
            <a href="/testimonios" title="Español">&#x1F1EA;&#x1F1F8; ES</a>
            <a href="/testimonios-de" title="Deutsch">&#x1F1E9;&#x1F1EA; DE</a>
            <a href="/testimonios-fr" title="Français">&#x1F1EB;&#x1F1F7; FR</a>
          </div>
        </div>
        <a href="/cart-de" class="cart-icon-wrapper" title="Warenkorb ansehen">
          🛒
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
    <nav>
      <button class="hamburger" id="hamburger-btn" aria-label="Menü öffnen">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="menu" id="nav-menu">
        <a href="/de">Startseite</a>
        <a href="/gallery-de">Galerie</a>
        <a href="/shop-de">Shop</a>        <a href="/testimonios-de">Bewertungen</a>        <a href="/about-de">Über uns</a>
        <a href="/contact-de">Kontakt</a>
      </div>
    </nav>
  </header>

  <main>
    <h2>⭐ Kundenbewertungen</h2>

    <!-- Reseñas -->
    <div id="reviews-container" class="reviews-grid">
      <div style="text-align:center; padding:40px; grid-column: 1 / -1;">
        <p style="opacity:0.7;">Bewertungen werden geladen...</p>
      </div>
    </div>

    <!-- Formulario para dejar reseña -->
    <section class="leave-review-section" style="max-width: 700px; margin: 3rem auto;">
      <h3 style="color: var(--gold); text-align:center; margin-bottom:1.5rem;">Hinterlassen Sie Ihre Bewertung</h3>
      <form id="review-form" class="review-form">
        <label>
          Name *
          <input type="text" name="nombre" required placeholder="Ihr Name" />
        </label>
        
        <label>
          E-Mail (optional)
          <input type="email" name="email" placeholder="ihre@email.com" />
          <small style="opacity:0.7; font-size:12px;">Wird nicht veröffentlicht</small>
        </label>
        
        <label>
          Bewertung *
          <div class="star-rating" id="star-rating">
            <span class="star" data-rating="1">⭐</span>
            <span class="star" data-rating="2">⭐</span>
            <span class="star" data-rating="3">⭐</span>
            <span class="star" data-rating="4">⭐</span>
            <span class="star" data-rating="5">⭐</span>
          </div>
          <input type="hidden" name="rating" id="rating-input" required />
        </label>
        
        <label>
          Ihre Meinung *
          <textarea name="comentario" required rows="4" 
            placeholder="Erzählen Sie uns von Ihrer Erfahrung mit unseren Produkten..."></textarea>
        </label>
        
        <label>
          Fotos (optional, max. 5)
          <input type="file" name="fotos" accept="image/*" multiple id="review-photos" />
          <small style="opacity:0.7; font-size:12px;">Teilen Sie Fotos Ihres Produkts</small>
          <div id="photo-preview" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;"></div>
        </label>
        
        <button type="submit" id="submit-btn">Bewertung abschicken</button>
        <div id="form-status" style="margin-top:15px; text-align:center;"></div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 LITUM3D. Alle Rechte vorbehalten.</p>
    <div>
      <a href="/terms-conditions">AGB</a>
      <a href="/privacy-policy">Datenschutz</a>
      <a href="/cookies-policy">Cookies</a>
    </div>
  </footer>

  <script src="/js/cart.js?v=20260818-1"></script>
  <script src="/js/testimonios.js?v=20260818-1"></script>
  <script src="/js/cookie-banner.js?v=20260818-1"></script>
</body>

</html>

<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/img/logos/favicon.png" />
  <link rel="apple-touch-icon" href="/img/logos/favicon.png" />

  <title>Testimonios - LITUM3D</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/navbar.js"></script>
</head>

<body>
  <header>
    <div class="header-top">
      <a href="/" class="logo"><img src="/img/logos/lineal.logo.png" alt="LITUM3D Logo"></a>
      <div class="language-selector">
        <span class="lang-flag">&#x1F1EA;&#x1F1F8;</span>
        <div class="lang-dropdown">
          <a href="/testimonios" title="Español">&#x1F1EA;&#x1F1F8; ES</a>
          <a href="/testimonios-de" title="Deutsch">&#x1F1E9;&#x1F1EA; DE</a>
          <a href="/testimonios-fr" title="Français">&#x1F1EB;&#x1F1F7; FR</a>
        </div>
      </div>
    </div>
    <nav>
      <button class="hamburger" id="hamburger-btn" aria-label="Abrir menú">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="menu" id="nav-menu">
        <a href="/">Inicio</a>
        <a href="/gallery">Galería</a>
        <a href="/shop">Tienda</a>
        <a href="/about">Sobre</a>
        <a href="/contact">Contacto</a>
        <a href="/cart" class="cart-icon-wrapper" title="Ver carrito">
          🛒
          <span class="cart-badge">0</span>
        </a>
      </div>
    </nav>
  </header>

  <main>
    <h2>⭐ Testimonios de Nuestros Clientes</h2>

    <!-- Reseñas -->
    <div id="reviews-container" class="reviews-grid">
      <div style="text-align:center; padding:40px; grid-column: 1 / -1;">
        <p style="opacity:0.7;">Cargando reseñas...</p>
      </div>
    </div>

    <!-- Formulario para dejar reseña -->
    <section class="leave-review-section" style="max-width: 700px; margin: 3rem auto;">
      <h3 style="color: var(--gold); text-align:center; margin-bottom:1.5rem;">Deja tu Reseña</h3>
      <form id="review-form" class="review-form">
        <label>
          Nombre *
          <input type="text" name="nombre" required placeholder="Tu nombre" />
        </label>
        
        <label>
          Email (opcional)
          <input type="email" name="email" placeholder="tu@email.com" />
          <small style="opacity:0.7; font-size:12px;">No será publicado</small>
        </label>
        
        <label>
          Calificación *
          <div class="star-rating" id="star-rating">
            <span class="star" data-rating="1">⭐</span>
            <span class="star" data-rating="2">⭐</span>
            <span class="star" data-rating="3">⭐</span>
            <span class="star" data-rating="4">⭐</span>
            <span class="star" data-rating="5">⭐</span>
          </div>
          <input type="hidden" name="rating" id="rating-input" required />
        </label>
        
        <label>
          Tu Opinión *
          <textarea name="comentario" required rows="4" 
            placeholder="Cuéntanos tu experiencia con nuestros productos..."></textarea>
        </label>
        
        <label>
          Fotos (opcional, máx. 5)
          <input type="file" name="fotos" accept="image/*" multiple id="review-photos" />
          <small style="opacity:0.7; font-size:12px;">Comparte fotos de tu producto</small>
          <div id="photo-preview" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;"></div>
        </label>
        
        <button type="submit" id="submit-btn">Enviar Reseña</button>
        <div id="form-status" style="margin-top:15px; text-align:center;"></div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 LITUM3D. Todos los derechos reservados.</p>
    <div>
      <a href="/terms-conditions">Términos</a>
      <a href="/privacy-policy">Privacidad</a>
      <a href="/cookies-policy">Cookies</a>
    </div>
  </footer>

  <script src="/js/cart.js"></script>
  <script src="/js/testimonios.js"></script>
  <script src="/js/cookie-banner.js"></script>
</body>

</html>

  <script src="/js/navbar.js?v=20260818-1"></script>
  <link rel="canonical" href="https://litum3d.com/testimonios-fr">
  <link rel="alternate" hreflang="es" href="https://litum3d.com/testimonios">
  <link rel="alternate" hreflang="de" href="https://litum3d.com/testimonios-de">
  <link rel="alternate" hreflang="fr" href="https://litum3d.com/testimonios-fr">

</head>

<body>
  <header>
    <div class="header-top">
      <a href="/fr" class="logo"><img src="/img/logos/lineal.logo.png" alt="LITUM3D Logo"></a>
      <div class="header-actions">
        <div class="language-selector">
          <span class="lang-flag">&#x1F1EB;&#x1F1F7;</span>
          <div class="lang-dropdown">
            <a href="/testimonios" title="Español">&#x1F1EA;&#x1F1F8; ES</a>
            <a href="/testimonios-de" title="Deutsch">&#x1F1E9;&#x1F1EA; DE</a>
            <a href="/testimonios-fr" title="Français">&#x1F1EB;&#x1F1F7; FR</a>
          </div>
        </div>
        <a href="/cart-fr" class="cart-icon-wrapper" title="Voir le panier">
          🛒
          <span class="cart-badge">0</span>
        </a>
      </div>
    </div>
    <nav>
      <button class="hamburger" id="hamburger-btn" aria-label="Ouvrir le menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <div class="menu" id="nav-menu">
        <a href="/fr">Accueil</a>
        <a href="/gallery-fr">Galerie</a>
        <a href="/shop-fr">Boutique</a>        <a href="/testimonios-fr">Avis</a>        <a href="/about-fr">À propos</a>
        <a href="/contact-fr">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <h1 class="page-title">⭐ Témoignages de Nos Clients</h1>

    <!-- Reseñas -->
    <div id="reviews-container" class="reviews-grid">
      <div style="text-align:center; padding:40px; grid-column: 1 / -1;">
        <p style="opacity:0.7;">Chargement des avis...</p>
      </div>
    </div>

    <!-- Formulario para dejar reseña -->
    <section class="leave-review-section" style="max-width: 700px; margin: 3rem auto;">
      <h3 style="color: var(--gold); text-align:center; margin-bottom:1.5rem;">Laissez Votre Avis</h3>
      <form id="review-form" class="review-form">
        <label>
          Nom *
          <input type="text" name="nombre" required placeholder="Votre nom" />
        </label>
        
        <label>
          Email (optionnel)
          <input type="email" name="email" placeholder="votre@email.com" />
          <small style="opacity:0.7; font-size:12px;">Ne sera pas publié</small>
        </label>
        
        <label>
          Évaluation *
          <div class="star-rating" id="star-rating">
            <span class="star" data-rating="1">⭐</span>
            <span class="star" data-rating="2">⭐</span>
            <span class="star" data-rating="3">⭐</span>
            <span class="star" data-rating="4">⭐</span>
            <span class="star" data-rating="5">⭐</span>
          </div>
          <input type="hidden" name="rating" id="rating-input" required />
        </label>
        
        <label>
          Votre Avis *
          <textarea name="comentario" required rows="4" 
            placeholder="Partagez votre expérience avec nos produits..."></textarea>
        </label>
        
        <label>
          Photos (optionnel, max. 5)
          <input type="file" name="fotos" accept="image/*" multiple id="review-photos" />
          <small style="opacity:0.7; font-size:12px;">Partagez des photos de votre produit</small>
          <div id="photo-preview" style="display:flex; flex-wrap:wrap; gap:10px; margin-top:10px;"></div>
        </label>
        
        <button type="submit" id="submit-btn">Envoyer l'Avis</button>
        <div id="form-status" style="margin-top:15px; text-align:center;"></div>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 LITUM3D. Tous droits réservés.</p>
    <div>
      <a href="/terms-conditions-fr">Conditions</a>
      <a href="/privacy-policy-fr">Confidentialité</a>
      <a href="/cookies-policy-fr">Cookies</a>
    </div>
  </footer>

  <script src="/js/cart.js?v=20260818-1"></script>
  <script src="/js/testimonios.js?v=20260818-1"></script>
  <script src="/js/cookie-banner.js?v=20260818-1"></script>
</body>

</html>

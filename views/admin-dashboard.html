<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - LITUM 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 20px;
        }

        .dashboard-title {
            color: #fff;
            font-size: 32px;
            background: linear-gradient(135deg, #64c8ff 0%, #9664ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .logout-btn {
            padding: 10px 20px;
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 68, 68, 0.3);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            background: rgba(255, 68, 68, 0.3);
            box-shadow: 0 4px 15px rgba(255, 68, 68, 0.2);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 20px;
            text-align: center;
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            background: linear-gradient(135deg, #64c8ff 0%, #9664ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            margin-top: 8px;
        }

        .orders-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
        }

        .orders-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .orders-title {
            color: #fff;
            font-size: 18px;
            font-weight: 600;
        }

        .filter-select {
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 200, 255, 0.5);
        }

        .filter-select option {
            background: #1a1a1a;
            color: #fff;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            overflow-x: auto;
            display: block;
        }

        .orders-table thead {
            display: block;
        }

        .orders-table tbody {
            display: block;
            max-height: 600px;
            overflow-y: auto;
        }

        .orders-table tr {
            display: flex;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
            gap: 15px;
        }

        .orders-table thead tr {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.7);
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .orders-table tbody tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .col-id {
            flex: 0.8;
        }

        .col-date {
            flex: 1.2;
        }

        .col-customer {
            flex: 1.5;
        }

        .col-total {
            flex: 1;
        }

        .col-status {
            flex: 1.5;
        }

        .col-actions {
            flex: 1;
        }

        .order-id {
            color: #64c8ff;
            font-weight: 600;
        }

        .order-date {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .order-customer {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
        }

        .order-total {
            color: rgba(100, 200, 255, 0.9);
            font-weight: 600;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid transparent;
        }

        .status-pendiente {
            background: rgba(255, 150, 0, 0.2);
            color: #ffaa00;
            border-color: rgba(255, 150, 0, 0.3);
        }

        .status-confirmado {
            background: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
            border-color: rgba(100, 200, 255, 0.3);
        }

        .status-preparando {
            background: rgba(150, 100, 255, 0.2);
            color: #b366ff;
            border-color: rgba(150, 100, 255, 0.3);
        }

        .status-enviado {
            background: rgba(100, 255, 150, 0.2);
            color: #66ff99;
            border-color: rgba(100, 255, 150, 0.3);
        }

        .status-entregado {
            background: rgba(100, 255, 100, 0.2);
            color: #66ff66;
            border-color: rgba(100, 255, 100, 0.3);
        }

        .status-cancelado {
            background: rgba(255, 68, 68, 0.2);
            color: #ff6b6b;
            border-color: rgba(255, 68, 68, 0.3);
        }

        .action-btn {
            padding: 6px 12px;
            background: rgba(100, 200, 255, 0.2);
            color: #64c8ff;
            border: 1px solid rgba(100, 200, 255, 0.3);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .action-btn:hover {
            background: rgba(100, 200, 255, 0.3);
            box-shadow: 0 4px 12px rgba(100, 200, 255, 0.2);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(31, 38, 135, 0.37);
        }

        .modal-header {
            color: #fff;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            color: rgba(255, 255, 255, 0.9);
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: 500;
        }

        .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .form-group select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(100, 200, 255, 0.5);
            box-shadow: 0 0 10px rgba(100, 200, 255, 0.3);
        }

        .form-group select option {
            background: #1a1a1a;
            color: #fff;
        }

        .order-details {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            margin-bottom: 8px;
        }

        .detail-row:last-child {
            margin-bottom: 0;
        }

        .detail-label {
            font-weight: 500;
        }

        .detail-value {
            color: #64c8ff;
        }

        .modal-footer {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-save {
            background: linear-gradient(135deg, #64c8ff 0%, #9664ff 100%);
            color: #fff;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(100, 200, 255, 0.4);
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255, 255, 255, 0.6);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .empty-state-text {
            font-size: 14px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.6);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(100, 200, 255, 0.3);
            border-top-color: #64c8ff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .dashboard-header {
                flex-direction: column;
                align-items: flex-start;
            }

            .orders-table {
                font-size: 12px;
            }

            .orders-table tr {
                flex-wrap: wrap;
            }

            .col-customer,
            .col-date {
                flex: 1 0 100%;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <h1 class="dashboard-title">📊 Panel de Administración</h1>
        <button class="logout-btn" onclick="logout()">🚪 Cerrar Sesión</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-number" id="totalOrders">0</div>
            <div class="stat-label">Pedidos Totales</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="pendingOrders">0</div>
            <div class="stat-label">Pendientes</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="inProgressOrders">0</div>
            <div class="stat-label">En Proceso</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalRevenue">$0</div>
            <div class="stat-label">Ingresos Totales</div>
        </div>
    </div>

    <div class="orders-container">
        <div class="orders-header">
            <h2 class="orders-title">📦 Pedidos Recientes</h2>
            <select class="filter-select" id="statusFilter" onchange="filterOrders()">
                <option value="">Todos los estados</option>
                <option value="Pendiente">Pendiente</option>
                <option value="Confirmado">Confirmado</option>
                <option value="Preparando">Preparando</option>
                <option value="Enviado">Enviado</option>
                <option value="Entregado">Entregado</option>
                <option value="Cancelado">Cancelado</option>
            </select>
        </div>

        <div id="ordersContent">
            <div class="loading">
                <div class="spinner"></div>
                <p>Cargando pedidos...</p>
            </div>
        </div>
    </div>

    <!-- Modal para cambiar estado -->
    <div class="modal" id="statusModal">
        <div class="modal-content">
            <div class="modal-header">✏️ Cambiar Estado del Pedido</div>
            <div class="modal-body">
                <div class="order-details" id="orderInfo"></div>
                <div class="form-group">
                    <label for="newStatus">Nuevo Estado:</label>
                    <select id="newStatus">
                        <option value="Pendiente">Pendiente</option>
                        <option value="Confirmado">Confirmado</option>
                        <option value="Preparando">Preparando</option>
                        <option value="Enviado">Enviado</option>
                        <option value="Entregado">Entregado</option>
                        <option value="Cancelado">Cancelado</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="btn btn-save" onclick="saveStatus()">Guardar Cambio</button>
            </div>
        </div>
    </div>

    <script>
        let orders = [];
        let currentEditingOrderId = null;

        async function loadOrders() {
            try {
                const response = await fetch('/admin/api/dashboard');
                if (!response.ok) {
                    if (response.status === 401) {
                        window.location.href = '/admin/login';
                        return;
                    }
                    throw new Error('Error al cargar pedidos');
                }
                const data = await response.json();
                orders = data.orders || [];
                renderOrders();
                updateStats();
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('ordersContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <div class="empty-state-text">Error al cargar los pedidos</div>
                    </div>
                `;
            }
        }

        function renderOrders(filteredOrders = orders) {
            if (filteredOrders.length === 0) {
                document.getElementById('ordersContent').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">No hay pedidos con ese filtro</div>
                    </div>
                `;
                return;
            }

            const table = `
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th class="col-id">Pedido #</th>
                            <th class="col-date">Fecha</th>
                            <th class="col-customer">Cliente</th>
                            <th class="col-total">Total</th>
                            <th class="col-status">Estado</th>
                            <th class="col-actions">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredOrders.map(order => `
                            <tr>
                                <td class="col-id"><span class="order-id">#${order.id}</span></td>
                                <td class="col-date"><span class="order-date">${new Date(order.created_at).toLocaleDateString('es-ES', { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' })}</span></td>
                                <td class="col-customer"><span class="order-customer">${order.customer_name || 'Anónimo'}</span></td>
                                <td class="col-total"><span class="order-total">€${parseFloat(order.total).toFixed(2)}</span></td>
                                <td class="col-status"><span class="status-badge status-${order.estado_nombre.toLowerCase()}">${order.estado_nombre}</span></td>
                                <td class="col-actions"><button class="action-btn" onclick="openModal(${order.id}, '${order.estado_nombre}', '${order.customer_name || 'Anónimo'}', ${order.total})">Editar</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('ordersContent').innerHTML = table;
        }

        function updateStats() {
            const total = orders.length;
            const pending = orders.filter(o => o.estado_nombre === 'Pendiente').length;
            const inProgress = orders.filter(o => ['Confirmado', 'Preparando'].includes(o.estado_nombre)).length;
            const revenue = orders.reduce((sum, o) => sum + parseFloat(o.total), 0);

            document.getElementById('totalOrders').textContent = total;
            document.getElementById('pendingOrders').textContent = pending;
            document.getElementById('inProgressOrders').textContent = inProgress;
            document.getElementById('totalRevenue').textContent = '€' + revenue.toFixed(2);
        }

        function filterOrders() {
            const filter = document.getElementById('statusFilter').value;
            const filtered = filter ? orders.filter(o => o.estado_nombre === filter) : orders;
            renderOrders(filtered);
        }

        function openModal(orderId, currentStatus, customerName, total) {
            currentEditingOrderId = orderId;
            document.getElementById('newStatus').value = currentStatus;
            document.getElementById('orderInfo').innerHTML = `
                <div class="detail-row">
                    <span class="detail-label">Pedido #</span>
                    <span class="detail-value">${orderId}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Cliente</span>
                    <span class="detail-value">${customerName}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Total</span>
                    <span class="detail-value">€${parseFloat(total).toFixed(2)}</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Estado Actual</span>
                    <span class="detail-value">${currentStatus}</span>
                </div>
            `;
            document.getElementById('statusModal').classList.add('show');
        }

        function closeModal() {
            document.getElementById('statusModal').classList.remove('show');
            currentEditingOrderId = null;
        }

        async function saveStatus() {
            const newStatus = document.getElementById('newStatus').value;
            if (!currentEditingOrderId) return;

            try {
                const response = await fetch(`/admin/pedidos/${currentEditingOrderId}/estado`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ estado: newStatus })
                });

                if (!response.ok) {
                    throw new Error('Error al actualizar estado');
                }

                const data = await response.json();
                if (data.success) {
                    closeModal();
                    loadOrders();
                } else {
                    alert('Error: ' + (data.error || 'No se pudo actualizar el estado'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error al guardar los cambios');
            }
        }

        function logout() {
            fetch('/admin/logout', { method: 'POST' })
                .then(() => window.location.href = '/')
                .catch(e => console.error('Error:', e));
        }

        // Cerrar modal al hacer click fuera
        document.getElementById('statusModal').addEventListener('click', (e) => {
            if (e.target.id === 'statusModal') {
                closeModal();
            }
        });

        // Cargar pedidos al iniciar
        loadOrders();
    </script>
</body>
</html>
